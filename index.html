<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manhwa Status">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<title>Manhwa Status</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}
/* Layout : une colonne pour le pouce — résumé en haut, liste de sites triée par statut */
:root{--bg:#f6f6fa;--card:#ffffff;--line:#e3e3ec;--fg:#17161f;--mut:#6b6a7a;--acc:#6d4ae8;--up:#15803d;--down:#c62828;--unk:#8a8798;
--fd:"Space Grotesk",system-ui,sans-serif;--fb:"Inter",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111017;--card:#1b1a24;--line:#2b2a37;--fg:#ecebf3;--mut:#9895a8;--acc:#9b82ff;--up:#34d27a;--down:#ff6b6b;--unk:#77748a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111017;--card:#1b1a24;--line:#2b2a37;--fg:#ecebf3;--mut:#9895a8;--acc:#9b82ff;--up:#34d27a;--down:#ff6b6b;--unk:#77748a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px;display:flex;flex-direction:column;gap:10px}
h1{font:700 24px/1.1 var(--fd);margin:0;letter-spacing:-.01em}
.when{font-size:12px;color:var(--mut);margin:0;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pill b{display:block;font:700 22px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.pill span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pill.up b{color:var(--up)}.pill.down b{color:var(--down)}.pill.unk b{color:var(--unk)}
#q{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:11px 12px;font:16px var(--fb)}
#q:focus-visible,.filters button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 14px;font:500 14px var(--fb);min-height:36px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
li a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;text-decoration:none;min-height:62px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--unk)}
.up .dot{background:var(--up)}.down .dot{background:var(--down)}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-weight:600}
.sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;text-align:right;font:600 13px var(--fb)}
.up .st{color:var(--up)}.down .st{color:var(--down)}.unk .st{color:var(--unk)}
.st small{display:block;font-weight:400;font-size:11px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mut);padding:28px 0}
footer{font-size:12px;color:var(--mut);margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Manhwa Status</h1><p class="when" id="when"></p></div>
  <div class="sum">
    <div class="pill up"><b id="nUp">0</b><span>En ligne</span></div>
    <div class="pill down"><b id="nDown">0</b><span>Hors ligne</span></div>
    <div class="pill unk"><b id="nUnk">0</b><span>Inconnu</span></div>
  </div>
  <input id="q" type="search" placeholder="Rechercher un site…" autocomplete="off" aria-label="Rechercher un site">
  <div class="filters" id="filters">
    <button data-f="all" aria-pressed="true">Tous</button>
    <button data-f="up" aria-pressed="false">En ligne</button>
    <button data-f="down" aria-pressed="false">Hors ligne</button>
    <button data-f="Scans" aria-pressed="false">Scans</button>
    <button data-f="Agrégateur" aria-pressed="false">Agrégateurs</button>
    <button data-f="Officiel" aria-pressed="false">Officiels</button>
  </div>
</header>
<ul id="list"></ul>
<footer>Sites en anglais · statut revérifié automatiquement toutes les 30 min</footer>
</div>
<script>
let D={checked_at:0,sites:[]};
const $=s=>document.querySelector(s);let filter="all";
const cls=s=>s.status==="up"?"up":s.status==="down"?"down":"unk";
const LBL={up:"En ligne",down:"Hors ligne",unk:"Inconnu"};
const host=u=>{try{return new URL(u).host.replace(/^www\./,"")}catch{return u}};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(t){const m=Math.round((Date.now()/1000-t)/60);return m<1?"à l'instant":m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`}
function render(){
  if(!D.checked_at){$("#when").textContent="Chargement…";}
  const q=$("#q").value.trim().toLowerCase(),o={up:0,unk:1,down:2};
  const rows=D.sites.filter(s=>{
    if(q&&!(s.name.toLowerCase().includes(q)||s.url.includes(q)))return false;
    if(filter==="all")return true;if(filter==="up")return cls(s)==="up";if(filter==="down")return cls(s)==="down";
    return (s.tags||[]).includes(filter);}).sort((a,b)=>o[cls(a)]-o[cls(b)]||a.name.localeCompare(b.name));
  $("#list").innerHTML=rows.length?rows.map(s=>{const c=cls(s);
    const small=c==="up"?(s.ms?s.ms+" ms":""):c==="down"?esc(s.detail):"Pas encore vérifié";
    const u=s.final_url||s.url;
    return `<li class="${c}"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span class="dot"></span>
    <span class="info"><span class="name">${esc(s.name)}</span><span class="sub">${esc(host(u))}</span></span>
    <span class="st">${LBL[c]}<small>${small}</small></span></a></li>`}).join(""):`<p class="empty">Aucun site ne correspond.</p>`;
  const n=k=>D.sites.filter(s=>cls(s)===k).length;
  $("#nUp").textContent=n("up");$("#nDown").textContent=n("down");$("#nUnk").textContent=n("unk");
  const d=new Date(D.checked_at*1000);
  $("#when").textContent=`Vérifié ${ago(D.checked_at)} · ${d.toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`;
}
$("#q").addEventListener("input",render);
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
async function load(){
  try{const r=await fetch("status.json?t="+Date.now(),{cache:"no-store"});D=await r.json();render();}
  catch(e){$("#when").textContent="Impossible de charger les statuts. Réessaie dans un instant.";}
}
load();setInterval(load,5*60000);setInterval(()=>D.checked_at&&render(),60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>

</body>
</html>
